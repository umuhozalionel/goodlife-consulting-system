services:
  - type: web
    name: goodlife-consulting
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm build
    startCommand: pnpm start
    rootDir: .
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: goodlife-consulting
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-fbsvc@goodlife-consulting.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false # set in the Render dashboard, never in this file
